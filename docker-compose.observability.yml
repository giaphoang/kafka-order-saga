# Observability override: Prometheus + Grafana.
# Services run on the host, so Prometheus scrapes them via host.docker.internal.
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d prometheus grafana
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    hostname: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:11.1.0
    hostname: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "commerce"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
