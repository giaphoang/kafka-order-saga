server:
  port: 8081
spring:
  application.name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerce?currentSchema=orders
    username: commerce
    password: commerce
  jpa:
    hibernate.ddl-auto: update
    properties.hibernate.default_schema: orders
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-status-projector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: dev.kafka.contracts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include: health,info,metrics,prometheus
