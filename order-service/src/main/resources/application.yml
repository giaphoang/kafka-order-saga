server:
  port: 8081
spring:
  application.name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerce?currentSchema=orders
    username: commerce
    password: commerce
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: orders
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-status-projector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: dev.kafka.contracts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include: health,info,metrics,prometheus

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-in-production}
    ttl-seconds: 3600
  demo:
    username: ${DEMO_USERNAME:demo}
    password: ${DEMO_PASSWORD:demo-password}
