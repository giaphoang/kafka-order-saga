server:
  port: 8082
spring:
  application.name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerce?currentSchema=inventory
    username: commerce
    password: commerce
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: inventory
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: dev.kafka.contracts
    listener.ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include: health,info,metrics,prometheus
